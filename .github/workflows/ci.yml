name: CI & Security Audit Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-and-build:
    name: Validate, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies (Deterministic npm ci)
        run: npm ci

      - name: Validate Portfolio Content Schemas
        run: node scripts/validate-content.js

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test

      - name: Verify Production Next.js Build
        run: npm run build
